name: Benchmark build and run

# Builds the branch benchmark code against Spack-installed dependencies
# for CPU and GPU versions. Runs the CPU version of the branch
# benchmark.

on:
  # Uncomment the below 'push' to trigger on push
  push:
    branches:
      - "**"
  pull_request:
    branches: [ "main" ]
  merge_group:
    branches:
      - main
  workflow_dispatch:


jobs:
  build:
    strategy:
      matrix:
        backend:
          [
            { device: cpu, spack-opt: "+mpi%gcc ^openblas ^fftw"},
            { device: cuda, container-image: nvcr.io/nvidia/nvhpc:25.9-devel-cuda13.0-ubuntu22.04, spack-opt: "+mpi+cuda+mpigpu~scalapack%nvhpc" },
            # { device: rocm, spack_opt: "++rocm" },
          ]
    uses: ./.github/workflows/build.yml  
    with:
      container-image: ${{ matrix.backend.container-image }}
      spack-buildcache: oci://ghcr.io/ukri-bench/spack-buildcache-qe
      build-device: ${{ matrix.backend.device }}
      spack-opt: ${{ matrix.backend.spack-opt }}
    secrets: inherit
    permissions:
      packages: write

